<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/assets/icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0A1322" />
<title>Mon tracker - IT BOY</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

<div id="nav-mount"></div>

<div class="page-shell" style="padding-top:36px">
  <div class="dashboard-greeting">
    <h1 class="font-cinzel" id="greeting">Bonjour !</h1>
    <p id="greeting-subtitle">Aperçu</p>
  </div>

  <div id="banner-zone" style="width:100%;max-width:640px"></div>

  <div id="evening-nudge" style="width:100%;max-width:640px;display:none"></div>

  <div class="overview-stats" id="overview-stats"></div>

  <div class="dashboard-actions">
    <a class="action-chip" href="../stats/combined/">Comparer les calendriers</a>
    <a class="action-chip" href="../stats/">Statistiques détaillées</a>
    <a class="action-chip" href="../archived/">Habitudes archivées</a>
    <button class="action-chip" id="export-csv-btn" type="button">Exporter en CSV</button>
  </div>

  <p class="plan-limit-note" id="plan-limit-note"></p>

  <div class="section-heading-row">
    <div class="section-heading" style="margin:0">Aujourd'hui</div>
    <div class="tab-bar" id="sort-toggle" style="margin:0">
      <button class="tab-btn active" type="button" data-sort="activity">Par activité</button>
      <button class="tab-btn" type="button" data-sort="manual">Manuel</button>
    </div>
  </div>
  <div id="today-progress"></div>
  <div class="habit-list" id="habit-list"></div>

  <button class="add-habit-btn" id="add-habit-toggle" type="button">+ Ajouter une habitude</button>

  <form class="form" id="add-habit-form" style="display:none;margin-top:20px">
    <label class="form-label">Type
      <select class="form-select" name="type" id="type-select">
        <option value="habit">Habitude (avec streak)</option>
        <option value="tracker">Tracker simple (sans streak)</option>
      </select>
    </label>
    <label class="form-label">Nom
      <input class="form-input" type="text" name="name" required />
    </label>
    <label class="form-label">Domaine
      <select class="form-select" name="category" required>
        <option value="sante">Sante</option>
        <option value="productivite">Productivite</option>
        <option value="mindset">Mindset &amp; discipline</option>
        <option value="finance">Finances</option>
      </select>
    </label>
    <label class="form-label">Description <span class="link-muted" style="font-weight:400">(optionnel)</span>
      <textarea class="form-input" name="description" rows="2" maxlength="240" placeholder="Pourquoi cette habitude compte pour toi..."></textarea>
    </label>
    <label class="form-label">Couleur
      <div class="color-picker" id="color-picker">
        <button type="button" class="color-swatch active" data-color="#CDA34E" style="background:#CDA34E" aria-label="Or"></button>
        <button type="button" class="color-swatch" data-color="#7FB3D5" style="background:#7FB3D5" aria-label="Bleu"></button>
        <button type="button" class="color-swatch" data-color="#8FC1A9" style="background:#8FC1A9" aria-label="Vert"></button>
        <button type="button" class="color-swatch" data-color="#D98880" style="background:#D98880" aria-label="Corail"></button>
        <button type="button" class="color-swatch" data-color="#C39BD3" style="background:#C39BD3" aria-label="Violet"></button>
        <button type="button" class="color-swatch" data-color="#F0B27A" style="background:#F0B27A" aria-label="Ambre"></button>
      </div>
      <input type="hidden" name="color" id="color-input" value="#CDA34E" />
    </label>
    <label class="form-label" id="frequency-wrap">Frequence
      <select class="form-select" name="frequency" id="frequency-select">
        <option value="daily">Quotidienne</option>
        <option value="weekly">X fois par semaine</option>
      </select>
    </label>
    <label class="form-label" id="frequency-count-label" style="display:none">Fois par semaine
      <input class="form-input" type="number" name="frequencyPerWeek" min="1" max="7" value="3" />
    </label>
    <button class="cta-btn" type="submit" style="margin-top:8px">Ajouter</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/lib/config.js"></script>
<script src="../assets/js/lib/supabaseClient.js"></script>
<script src="../assets/js/lib/ui.js"></script>
<script src="../assets/js/lib/track.js"></script>
<script src="../assets/js/lib/auth.js"></script>
<script src="../assets/js/lib/api.js"></script>
<script src="../assets/js/lib/plans.js"></script>
<script src="../assets/js/lib/streak.js"></script>
<script src="../assets/js/lib/habitCatalog.js"></script>
<script src="../assets/js/dashboard.js"></script>
</body>
</html>
